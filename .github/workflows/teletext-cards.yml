# Redraws the Tekst-TV page at the top of the README and pushes it to the
# output branch. https://github.com/Luke3520/teletext-cards
name: Teletext cards

on:
  schedule:
    - cron: "17 4 * * *" # every morning, before Copenhagen is up
  workflow_dispatch:
  push:
    paths: [.github/workflows/teletext-cards.yml]

permissions:
  contents: write # push the cards to the output branch

concurrency:
  group: teletext-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: Luke3520/teletext-cards@main
        with:
          # Classic token (repo, read:org) so private repos count too. They are
          # counted, never named. Falls back to public work if the secret is gone.
          github_token: ${{ secrets.TELETEXT_TOKEN || github.token }}
          publish_token: ${{ github.token }}
          publish_branch: output
          cards: page
          brand: LUCAS-TV
          subtitle: Backend developer|I build it, ship it, run it
          accent: red
          art: pipe-nisse
          timezone: Europe/Copenhagen
          # Named first, in this order. -name hides one; the rest follow.
          orgs: bikerental=BikeRental, Betalingsblik, DevOpsDynamite, microservices-happens=Microservices, shift-left-happens
